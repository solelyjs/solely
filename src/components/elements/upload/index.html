<div
    part="base"
    class="upload"
     :class="this.getUploadClasses()"
    :aria-busy="this.isUploading() ? 'true' : 'false'"
>
    <!-- 拖拽上传 -->
    <If condition="$data.drag">
        <div
            part="drag"
            class="upload__drag"
             :class="this.getDragClasses()"
            role="button"
            :tabindex="$data.disabled ? '-1' : '0'"
            :aria-disabled="$data.disabled ? 'true' : 'false'"
            :aria-label="this.getDragText()"
            @click="this.triggerUpload(event)"
            @keydown="this.handleTriggerKeydown(event)"
            @dragover="this.handleDragOver(event)"
            @dragleave="this.handleDragLeave(event)"
            @drop="this.handleDrop(event)"
        >
            <If test="$data.showIcon">
                <div part="drag-icon" class="upload__drag-icon" aria-hidden="true">
                    <svg class="solely-linear-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor"
                        stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                        <!-- 底部留出缺口的云朵 -->
                        <path d="M5.5 11.5H4.2a3 3 0 0 1-.2-6 4.2 4.2 0 0 1 8.1.6 2.6 2.6 0 0 1-.3 5.4h-1.3" />
                        <!-- 向上的箭头 -->
                        <path d="M8 13.8V7.5M5.8 9.5L8 7.3l2.2 2.2" />
                    </svg>
                </div>
            </If>
            <div part="drag-text" class="upload__drag-text">{{this.getDragText()}}</div>
            <div part="drag-hint" class="upload__drag-hint">支持单个或批量上传</div>
        </div>
    </If>

    <!-- 普通上传按钮 -->
    <If condition="!$data.drag">
        <div
            part="button"
            class="upload__button"
            role="button"
            :tabindex="$data.disabled ? '-1' : '0'"
            :aria-disabled="$data.disabled ? 'true' : 'false'"
            :aria-label="$data.buttonText || '上传文件'"
            @click="this.triggerUpload(event)"
            @keydown="this.handleTriggerKeydown(event)"
        >
            <span aria-hidden="true">+</span>
            <span>{{$data.buttonText || '上传文件'}}</span>
        </div>
    </If>

    <!-- 隐藏的文件输入 -->
    <input
        ref="fileInput"
        type="file"
        class="upload__input"
        aria-hidden="true"
        :accept="$data.accept"
        :multiple="$data.multiple"
        :disabled="$data.disabled"
        @change="this.handleFileChange(event)"
    />

    <!-- 文件列表 -->
    <If condition="$data.showUploadList && $data.parsedFileList?.length > 0">
        <ul part="list" class="upload__list" aria-label="上传文件列表">
            <For each="$data.parsedFileList" item="file">
                <li
                    part="list-item"
                    class="upload__list-item"
                    :class="{ 'upload__list-item--error': file.status === 'error' }"
                >
                    <If condition="file.url && (this.getListType() === 'picture' || this.getListType() === 'picture-card')">
                        <img
                            part="thumb"
                            class="upload__list-thumb"
                            :src="file.url"
                            :alt="file.name"
                        />
                    </If>
                    <div part="info" class="upload__list-info">
                        <div part="name" class="upload__list-name">{{file.name}}</div>
                        <If condition="file.size">
                            <div part="size" class="upload__list-size">{{this.formatSize(file.size)}}</div>
                        </If>
                        <If condition="file.status === 'error' && file.error">
                            <div part="error" class="upload__list-error">{{file.error}}</div>
                        </If>
                        <If condition="file.status === 'uploading'">
                            <div
                                part="progress"
                                class="upload__progress"
                                role="progressbar"
                                aria-valuemin="0"
                                aria-valuemax="100"
                                :aria-valuenow="file.percent || 0"
                                :aria-valuetext="(file.percent || 0) + '%'"
                                :aria-label="file.name + ' 上传进度'"
                            >
                                <div part="progress-bar" class="upload__progress-bar" :style="'width: ' + (file.percent || 0) + '%'"></div>
                            </div>
                        </If>
                    </div>
                    <span
                        part="status"
                        class="upload__list-status"
                        :class="'upload__list-status--' + file.status"
                        role="status"
                        aria-live="polite"
                    >
                        {{this.getStatusText(file.status)}}
                    </span>
                    <If condition="!$data.disabled">
                        <span
                            part="remove"
                            class="upload__list-remove"
                            role="button"
                            tabindex="0"
                            :aria-label="'移除 ' + file.name"
                            @click="this.handleRemove(file)"
                            @keydown="this.handleRemoveKeydown(file, event)"
                        >
                            <svg class="solely-linear-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                                <path d="M4.4 4.4 11.6 11.6 M11.6 4.4 4.4 11.6"></path>
                            </svg>
                        </span>
                    </If>
                </li>
            </For>
        </ul>
    </If>
</div>
