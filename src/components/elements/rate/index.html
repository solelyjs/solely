<div
    part="base"
    class="rate"
    :class="this.getRateClasses()"
    role="radiogroup"
    :aria-label="'评分，当前 ' + ($data.value || 0) + ' 分'"
    :aria-disabled="$data.disabled ? 'true' : 'false'"
    :aria-readonly="$data.readonly ? 'true' : 'false'"
    @keydown="this.handleKeyDown(event)"
    @pointerdown="this.handlePointerDown(event)"
    @pointermove="this.handlePointerMove(event)"
    @pointerup="this.handlePointerUp(event)"
    @pointercancel="this.handlePointerCancel(event)"
    @mouseleave="this.handleMouseLeave()"
>
    <For each="$data.starCount" item="i">
        <span
            part="star"
            class="rate__star"
            :class="this.getStarClasses(i)"
            :data-char="$data.character || '★'"
            :data-index="i"
            :title="this.getTooltip(i)"
            role="radio"
            :aria-checked="this.getStarAriaChecked(i)"
            :aria-label="this.getTooltip(i)"
            :tabindex="this.getStarTabindex(i)"
            @click="this.handleClick(i, event)"
            @mouseenter="this.handleMouseEnter(i)"
            @mousemove="this.handleMouseMove(i, event)"
        >
            {{$data.character || '★'}}
        </span>
    </For>
</div>
