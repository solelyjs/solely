<label
    part="base"
    class="radio"
    :class="this.getRadioClasses()"
    role="radio"
    :aria-checked="$data.checked ? 'true' : 'false'"
    :aria-disabled="this.isEffectivelyDisabled() ? 'true' : 'false'"
    :aria-label="$data.ariaLabel || undefined"
    @click="this.handleClick(event)"
    @keydown="this.handleKeyDown(event)"
>
    <span part="input" class="radio__input"></span>
    <span part="content" class="radio__content">
        <slot>{{$data.content}}</slot>
    </span>
</label>
