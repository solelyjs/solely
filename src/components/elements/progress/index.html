<div
    part="base"
    class="progress"
    :class="this.getProgressClasses()"
    role="progressbar"
    aria-valuemin="0"
    aria-valuemax="100"
    :aria-valuenow="this.clampedPercent"
    :aria-valuetext="this.getAriaValueText()"
    :aria-label="$data.label || undefined"
>
    <!-- 线性进度条 -->
    <If test="this.getType() === 'line'">
        <div part="outer" class="progress__outer" :style="'height: ' + ($data.strokeWidth || 8) + 'px'">
            <div
                part="inner"
                class="progress__inner"
                :class="this.getInnerClasses()"
                :style="'width: ' + this.clampedPercent + '%'"
            ></div>
        </div>
        <If test="$data.showInfo">
            <span part="text" class="progress__text"><If test="this.hasStatusIcon()"><svg class="solely-linear-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path :d="this.getStatusIconPath()"></path></svg></If><If test="!this.hasStatusIcon()">{{this.getText()}}</If></span>
        </If>
    </If>

    <!-- 圆形进度条 -->
    <If test="this.getType() === 'circle'">
        <svg
            part="circle"
            class="progress__circle"
            :width="$data.width || 120"
            :height="$data.width || 120"
            :viewBox="'0 0 ' + ($data.width || 120) + ' ' + ($data.width || 120)"
        >
            <circle
                part="circle-track"
                class="progress__circle-track"
                :cx="($data.width || 120) / 2"
                :cy="($data.width || 120) / 2"
                :r="(($data.width || 120) - ($data.strokeWidth || 6)) / 2"
                :stroke-width="$data.strokeWidth || 6"
            />
            <circle
                part="circle-path"
                class="progress__circle-path"
                :class="this.getCirclePathClasses()"
                :cx="($data.width || 120) / 2"
                :cy="($data.width || 120) / 2"
                :r="(($data.width || 120) - ($data.strokeWidth || 6)) / 2"
                :stroke-width="$data.strokeWidth || 6"
                :stroke-dasharray="this.circleCircumference"
                :stroke-dashoffset="this.circleOffset"
            />
        </svg>
        <If test="$data.showInfo">
            <span part="circle-text" class="progress__circle-text"><If test="this.hasStatusIcon()"><svg class="solely-linear-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path :d="this.getStatusIconPath()"></path></svg></If><If test="!this.hasStatusIcon()">{{this.getText()}}</If></span>
        </If>
    </If>
</div>
