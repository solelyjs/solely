<div
    ref="card"
    part="base"
    class="card"
    :class="this.getCardClasses()"
>
    <!-- 封面 -->
    <If test="$data.cover">
        <div part="cover" class="card__cover">
            <img :src="$data.cover" :alt="$data.coverAlt || ''" @error="this.handleCoverError(event)" />
        </div>
    </If>

    <!-- 头部：title / extra 属性 / extra 插槽任一存在即渲染 -->
    <If test="$data.title || $data.extra || this.hasNamedSlot('extra')">
        <div part="header" class="card__header">
            <If test="$data.title">
                <h3 part="title" class="card__title">{{$data.title}}</h3>
            </If>
            <div part="extra" class="card__extra">
                <slot name="extra">{{$data.extra}}</slot>
            </div>
        </div>
    </If>

    <!-- 加载状态 -->
    <If test="$data.loading">
        <div part="loading" class="card__loading">
            <span part="loading-icon" class="card__loading-icon"></span>
        </div>
    </If>

    <!-- 内容区 -->
    <If test="!$data.loading">
        <div part="body" class="card__body">
            <slot></slot>
        </div>
    </If>

    <!-- 操作区：仅在有 actions 属性项或 actions 插槽时渲染，避免空白带边框底栏 -->
    <If test="this.getActionItems().length > 0 || this.hasNamedSlot('actions')">
        <div part="actions" class="card__actions">
            <slot name="actions">
                <For each="this.getActionItems()" item="action" index="index">
                    <span
                        part="action"
                        class="card__action"
                        role="button"
                        tabindex="0"
                        :aria-label="action"
                        @click="this.handleActionClick(index, event)"
                        @keydown="this.handleActionKeydown(index, event)"
                    >{{action}}</span>
                </For>
            </slot>
        </div>
    </If>
</div>
