<div part="base" :class="this.getContainerClasses()">
    <If condition="$data.type === 'latitude' || $data.type === 'both'">
        <div part="group" class="coordinate-group">
            <If condition="$data.type === 'both'">
                <span part="label" class="coordinate-group__label">纬度</span>
            </If>
            <div part="input" class="dms-input" :class="this.getDmsInputClasses('latitude')">
                <div part="fields" class="dms-input__fields">
                    <input
                        part="field"
                        class="dms-input__field dms-input__field--degrees"
                        type="number"
                        min="0"
                        max="90"
                        :placeholder="this.getFieldPlaceholder('degrees')"
                        :value="this.getDmsDisplayValue('latitude', 'degrees')"
                        :disabled="$data.disabled"
                        :readonly="$data.readonly"
                        @input="this.handleDmsInput('latitude', 'degrees', event)"
                        @change="this.handleDmsChange('latitude', 'degrees', event)"
                        @focus="this.handleFocus('latitude', event)"
                        @blur="this.handleBlur('latitude', event)"
                        ref="latitudeDegreesInput"
                    />
                    <span part="unit" class="dms-input__unit">°</span>
                    <input
                        part="field"
                        class="dms-input__field"
                        type="number"
                        min="0"
                        max="59"
                        :placeholder="this.getFieldPlaceholder('minutes')"
                        :value="this.getDmsDisplayValue('latitude', 'minutes')"
                        :disabled="$data.disabled"
                        :readonly="$data.readonly"
                        @input="this.handleDmsInput('latitude', 'minutes', event)"
                        @change="this.handleDmsChange('latitude', 'minutes', event)"
                        @focus="this.handleFocus('latitude', event)"
                        @blur="this.handleBlur('latitude', event)"
                        ref="latitudeMinutesInput"
                    />
                    <span part="unit" class="dms-input__unit">′</span>
                    <input
                        part="field"
                        class="dms-input__field dms-input__field--seconds"
                        type="text"
                        inputmode="decimal"
                        :placeholder="this.getFieldPlaceholder('seconds')"
                        :disabled="$data.disabled"
                        :readonly="$data.readonly"
                        @blur="this.handleSecondsBlur('latitude', event)"
                        @change="this.handleSecondsChange('latitude', event)"
                        @keydown="this.handleSecondsKeyDown('latitude', event)"
                        ref="latitudeSecondsInput"
                    />
                    <span part="unit" class="dms-input__unit">″</span>
                </div>
                <If test="$data.showDirection">
                    <div
                        part="direction"
                        :class="this.getDirectionClasses('latitude')"
                        role="button"
                        :tabindex="$data.disabled || $data.readonly ? '-1' : '0'"
                        :aria-disabled="$data.disabled || $data.readonly ? 'true' : 'false'"
                        :aria-expanded="$data.latitudeDirectionOpen ? 'true' : 'false'"
                        aria-haspopup="listbox"
                        aria-label="纬度方向"
                        @click="this.toggleDirection('latitude')"
                        @keydown="this.handleDirectionKeydown('latitude', event)"
                        ref="latitudeDirectionInput"
                    >
                        <span class="dms-input__direction-value">{{this.getDmsDisplayValue('latitude', 'direction')}}</span>
                        <span class="dms-input__direction-arrow" aria-hidden="true">
                            <svg class="dms-input__direction-icon" viewBox="0 0 16 16" focusable="false">
                                <path d="M3.5 6 8 10.5 12.5 6"></path>
                            </svg>
                        </span>
                        <If test="$data.latitudeDirectionOpen">
                            <div class="dms-input__direction-dropdown" role="listbox" aria-label="纬度方向选项" @click="this.handleDropdownClick(event)">
                                <div
                                    :class="this.getDirectionOptionClasses('latitude', 'N')"
                                    role="option"
                                    tabindex="0"
                                    :aria-selected="this.getDmsDisplayValue('latitude', 'direction') === 'N' ? 'true' : 'false'"
                                    @click="this.selectDirection('latitude', 'N')"
                                    @keydown="this.handleDirectionOptionKeydown('latitude', 'N', event)"
                                >N</div>
                                <div
                                    :class="this.getDirectionOptionClasses('latitude', 'S')"
                                    role="option"
                                    tabindex="0"
                                    :aria-selected="this.getDmsDisplayValue('latitude', 'direction') === 'S' ? 'true' : 'false'"
                                    @click="this.selectDirection('latitude', 'S')"
                                    @keydown="this.handleDirectionOptionKeydown('latitude', 'S', event)"
                                >S</div>
                            </div>
                        </If>
                    </div>
                </If>
            </div>
            <If condition="$data.showDecimal">
                <span part="decimal" class="coordinate-decimal">{{this.getDecimalDisplayValue('latitude')}}</span>
            </If>
        </div>
    </If>

    <If condition="$data.type === 'longitude' || $data.type === 'both'">
        <div part="group" class="coordinate-group">
            <If condition="$data.type === 'both'">
                <span part="label" class="coordinate-group__label">经度</span>
            </If>
            <div part="input" class="dms-input" :class="this.getDmsInputClasses('longitude')">
                <div part="fields" class="dms-input__fields">
                    <input
                        part="field"
                        class="dms-input__field dms-input__field--degrees"
                        type="number"
                        min="0"
                        max="180"
                        :placeholder="this.getFieldPlaceholder('degrees')"
                        :value="this.getDmsDisplayValue('longitude', 'degrees')"
                        :disabled="$data.disabled"
                        :readonly="$data.readonly"
                        @input="this.handleDmsInput('longitude', 'degrees', event)"
                        @change="this.handleDmsChange('longitude', 'degrees', event)"
                        @focus="this.handleFocus('longitude', event)"
                        @blur="this.handleBlur('longitude', event)"
                        ref="longitudeDegreesInput"
                    />
                    <span part="unit" class="dms-input__unit">°</span>
                    <input
                        part="field"
                        class="dms-input__field"
                        type="number"
                        min="0"
                        max="59"
                        :placeholder="this.getFieldPlaceholder('minutes')"
                        :value="this.getDmsDisplayValue('longitude', 'minutes')"
                        :disabled="$data.disabled"
                        :readonly="$data.readonly"
                        @input="this.handleDmsInput('longitude', 'minutes', event)"
                        @change="this.handleDmsChange('longitude', 'minutes', event)"
                        @focus="this.handleFocus('longitude', event)"
                        @blur="this.handleBlur('longitude', event)"
                        ref="longitudeMinutesInput"
                    />
                    <span part="unit" class="dms-input__unit">′</span>
                    <input
                        part="field"
                        class="dms-input__field dms-input__field--seconds"
                        type="text"
                        inputmode="decimal"
                        :placeholder="this.getFieldPlaceholder('seconds')"
                        :disabled="$data.disabled"
                        :readonly="$data.readonly"
                        @blur="this.handleSecondsBlur('longitude', event)"
                        @change="this.handleSecondsChange('longitude', event)"
                        @keydown="this.handleSecondsKeyDown('longitude', event)"
                        ref="longitudeSecondsInput"
                    />
                    <span part="unit" class="dms-input__unit">″</span>
                </div>
                <If test="$data.showDirection">
                    <div
                        part="direction"
                        :class="this.getDirectionClasses('longitude')"
                        role="button"
                        :tabindex="$data.disabled || $data.readonly ? '-1' : '0'"
                        :aria-disabled="$data.disabled || $data.readonly ? 'true' : 'false'"
                        :aria-expanded="$data.longitudeDirectionOpen ? 'true' : 'false'"
                        aria-haspopup="listbox"
                        aria-label="经度方向"
                        @click="this.toggleDirection('longitude')"
                        @keydown="this.handleDirectionKeydown('longitude', event)"
                        ref="longitudeDirectionInput"
                    >
                        <span class="dms-input__direction-value">{{this.getDmsDisplayValue('longitude', 'direction')}}</span>
                        <span class="dms-input__direction-arrow" aria-hidden="true">
                            <svg class="dms-input__direction-icon" viewBox="0 0 16 16" focusable="false">
                                <path d="M3.5 6 8 10.5 12.5 6"></path>
                            </svg>
                        </span>
                        <If test="$data.longitudeDirectionOpen">
                            <div class="dms-input__direction-dropdown" role="listbox" aria-label="经度方向选项" @click="this.handleDropdownClick(event)">
                                <div
                                    :class="this.getDirectionOptionClasses('longitude', 'E')"
                                    role="option"
                                    tabindex="0"
                                    :aria-selected="this.getDmsDisplayValue('longitude', 'direction') === 'E' ? 'true' : 'false'"
                                    @click="this.selectDirection('longitude', 'E')"
                                    @keydown="this.handleDirectionOptionKeydown('longitude', 'E', event)"
                                >E</div>
                                <div
                                    :class="this.getDirectionOptionClasses('longitude', 'W')"
                                    role="option"
                                    tabindex="0"
                                    :aria-selected="this.getDmsDisplayValue('longitude', 'direction') === 'W' ? 'true' : 'false'"
                                    @click="this.selectDirection('longitude', 'W')"
                                    @keydown="this.handleDirectionOptionKeydown('longitude', 'W', event)"
                                >W</div>
                            </div>
                        </If>
                    </div>
                </If>
            </div>
            <If condition="$data.showDecimal">
                <span part="decimal" class="coordinate-decimal">{{this.getDecimalDisplayValue('longitude')}}</span>
            </If>
        </div>
    </If>
</div>
