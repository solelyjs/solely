<div part="group" class="form-control-group" :class="this.getGroupClasses()">
    <!-- 前置附加内容 -->
    <If test="$data.addonBefore">
        <span part="addon-before" class="form-control__addon form-control__addon--before">{{$data.addonBefore}}</span>
    </If>

    <div
        part="base"
        class="form-control"
        :class="this.getWrapperClasses()"
    >
        <!-- prefix 插槽 -->
        <If test="this.hasPrefixSlot()">
            <span part="prefix" class="form-control__prefix">
                <slot name="prefix"></slot>
            </span>
        </If>
        <ElseIf test="$data.prefix">
            <span part="prefix" class="form-control__prefix">{{$data.prefix}}</span>
        </ElseIf>

        <If test="$data.type === 'textarea'">
            <textarea
                part="input"
                class="form-control__input form-control__textarea"
                :value="$data.value"
                :placeholder="$data.placeholder"
                :disabled="this.isEffectivelyDisabled()"
                :readonly="$data.readonly"
                :maxlength="$data.maxlength"
                :minlength="$data.minlength"
                :rows="$data.rows"
                :aria-label="$data.ariaLabel || undefined"
                :aria-disabled="this.isEffectivelyDisabled() ? 'true' : 'false'"
                :aria-readonly="$data.readonly ? 'true' : 'false'"
                :aria-invalid="this.getStatus() === 'error' ? 'true' : 'false'"
                :aria-describedby="this.getMessageId()"
                @input="this.handleInput(event)"
                @focus="this.handleFocus(event)"
                @blur="this.handleBlur(event)"
                @change="this.handleChange(event)"
                @keydown="this.handleKeydown(event)"
            ></textarea>
        </If>
        <Else>
            <input
                part="input"
                class="form-control__input"
                :type="$data.passwordVisible && $data.type === 'password' ? 'text' : $data.type"
                :value="$data.value"
                :placeholder="$data.placeholder"
                :disabled="this.isEffectivelyDisabled()"
                :readonly="$data.readonly"
                :maxlength="$data.maxlength"
                :minlength="$data.minlength"
                :aria-label="$data.ariaLabel || undefined"
                :aria-disabled="this.isEffectivelyDisabled() ? 'true' : 'false'"
                :aria-readonly="$data.readonly ? 'true' : 'false'"
                :aria-invalid="this.getStatus() === 'error' ? 'true' : 'false'"
                :aria-describedby="this.getMessageId()"
                @input="this.handleInput(event)"
                @focus="this.handleFocus(event)"
                @blur="this.handleBlur(event)"
                @change="this.handleChange(event)"
                @keydown="this.handleKeydown(event)"
            />
        </Else>

        <!-- 三个装饰按钮共用 .form-control__action 的 20×20 盒子与 16×16 线性图标，
             避免系统 emoji 与文字符号的基线/字面高度不一致导致按钮高矮不齐 -->
        <If test="$data.type === 'password' && $data.showPassword">
            <span
                part="password-toggle"
                class="form-control__action form-control__password-toggle"
                role="button"
                :tabindex="this.isEffectivelyDisabled() ? '-1' : '0'"
                :aria-disabled="this.isEffectivelyDisabled() ? 'true' : 'false'"
                :aria-pressed="$data.passwordVisible ? 'true' : 'false'"
                :aria-label="$data.passwordVisible ? '隐藏密码' : '显示密码'"
                @click="this.togglePassword()"
                @keydown="this.handleActionKeydown(event, 'password')"
            >
                <If test="$data.passwordVisible">
                    <svg class="form-control__action-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                        <path d="M1.5 8S3.9 4.2 8 4.2s6.5 3.8 6.5 3.8-2.4 3.8-6.5 3.8S1.5 8 1.5 8Z"></path>
                        <circle cx="8" cy="8" r="2.1"></circle>
                        <path d="M2.6 2.6 13.4 13.4"></path>
                    </svg>
                </If>
                <Else>
                    <svg class="form-control__action-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                        <path d="M1.5 8S3.9 4.2 8 4.2s6.5 3.8 6.5 3.8-2.4 3.8-6.5 3.8S1.5 8 1.5 8Z"></path>
                        <circle cx="8" cy="8" r="2.1"></circle>
                    </svg>
                </Else>
            </span>
        </If>
        <If test="$data.copyable && $data.value && !this.isEffectivelyDisabled()">
            <span
                part="copy"
                class="form-control__action form-control__copy"
                role="button"
                :tabindex="this.isEffectivelyDisabled() ? '-1' : '0'"
                :aria-disabled="this.isEffectivelyDisabled() ? 'true' : 'false'"
                aria-label="复制内容"
                @click="this.handleCopy()"
                @keydown="this.handleActionKeydown(event, 'copy')"
            >
                <svg class="form-control__action-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                    <rect x="5.5" y="5.5" width="8.2" height="9" rx="1.4"></rect>
                    <path d="M10.6 3.6H4a1.5 1.5 0 0 0-1.5 1.5v7.3"></path>
                </svg>
            </span>
        </If>
        <!-- 清空放在装饰按钮最右侧：紧贴输入框右内边缘，避免被复制按钮挤到中间 -->
        <If test="$data.clearable && $data.value && !$data.readonly && !this.isEffectivelyDisabled()">
            <span
                part="clear"
                class="form-control__action close-btn form-control__clear"
                role="button"
                tabindex="0"
                aria-label="清除内容"
                @click="this.handleClear()"
                @keydown="this.handleActionKeydown(event, 'clear')"
            >
                <svg class="form-control__action-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                    <path d="M4.4 4.4 11.6 11.6 M11.6 4.4 4.4 11.6"></path>
                </svg>
            </span>
        </If>
        <If test="this.hasSuffixSlot()">
            <span part="suffix" class="form-control__suffix">
                <slot name="suffix"></slot>
            </span>
        </If>
        <ElseIf test="$data.suffix">
            <span part="suffix" class="form-control__suffix">{{$data.suffix}}</span>
        </ElseIf>

        <If test="$data.suggestions && $data.suggestions.length > 0 && !this.isEffectivelyDisabled() && this.filteredSuggestions && this.filteredSuggestions.length > 0">
            <div part="dropdown" class="dropdown" role="listbox" aria-label="输入建议">
                <For each="this.filteredSuggestions" item="suggestion">
                    <div
                        part="dropdown-item"
                        class="dropdown__item"
                        role="option"
                        tabindex="0"
                        :aria-label="suggestion"
                        @click="this.selectSuggestion(suggestion)"
                        @keydown="this.handleSuggestionKeydown(event, suggestion)"
                    >{{suggestion}}</div>
                </For>
            </div>
        </If>
    </div>

    <!-- 后置附加内容 -->
    <If test="$data.addonAfter">
        <span part="addon-after" class="form-control__addon form-control__addon--after">{{$data.addonAfter}}</span>
    </If>
</div>

<If test="$data.showCount">
    <div part="count" class="form-control__count">
        <span class="form-control__count-current">{{this.getCharCount()}}</span>
        <If test="$data.maxlength">
            <span class="form-control__count-separator">/</span>
            <span class="form-control__count-max">{{$data.maxlength}}</span>
        </If>
    </div>
</If>

<If test="$data.message">
    <div
        part="message"
        class="form-control__message"
        :class="'form-control__message--' + (this.getStatus() || 'default')"
        :id="this.getMessageId()"
    >
        {{$data.message}}
    </div>
</If>
